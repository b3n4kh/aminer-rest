services:
    aminer:
        image: ghcr.io/ait-aecid/logdata-anomaly-miner_rest
        container_name: aminer
        volumes:
            - ./testdata/aminer-run:/var/run:rw
            - ./testdata/aminer-rest-output.log:/tmp/aminer-rest/output.log:rw
            - ./testdata/aminer-rest-input.log:/tmp/syslog:ro
        networks:
            - aminer-net
        command: aminer -c /etc/aminer/config.yml
    aminer-rest:
        image: ghcr.io/ait-aecid/aminer-rest
        container_name: aminer-rest
        volumes:
            - ./testdata/aminer-run:/var/run:rw
            - ./testdata/aminer-rest-output.log:/tmp/aminer-rest/output.log
            - ./testdata/aminer-rest-input.log:/tmp/aminer-rest/input.log:rw
        expose:
            - "8000"
        networks:
            - aminer-net
        depends_on:
            aminer:
                condition: service_started
        healthcheck:
            test: [ "CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/openapi.json', timeout=5).close()" ]
            interval: 30s
            timeout: 20s
            retries: 10
            start_period: 30s
    aminer-client:
        image: curlimages/curl:latest
        container_name: aminer-client
        volumes:
            - ./testdata/testdata.log:/tmp/testdata.log
        networks:
            - aminer-net
        environment:
            - API_URL=http://aminer-rest:8000
        depends_on:
            aminer-rest:
                condition: service_healthy
        entrypoint: sh
        command:
            - -c
            - |
                sleep 5
                until curl -fsS "$${API_URL}/openapi.json" >/dev/null; do
                    sleep 1
                done
                log_id=1
                while IFS= read -r line || [ -n "$$line" ]; do
                    [ -n "$$line" ] || continue
                    timestamp=$$(date -u +%s)  # UTC timestamp in seconds
                    json=$$(printf '{"log_id": "%d", "timestamp": "%s", "severity": "info", "source": "remoteControlApiTest", "message": "%s"}' "$$log_id" "$$timestamp" "$$line")
                    curl -X POST http://aminer-rest:8000/aminer-input \
                         -H "Content-Type: application/json" \
                         -d "$$json" -sS >/dev/null
                    log_id=$$((log_id + 1))
                done < /tmp/testdata.log

volumes:
    aminer-source:
networks:
    aminer-net:
